const KOP_CUSTOMER_SECTION_KEYS = ["landing","findings","penetrant","landingSurfaces","valves","seats","cwConnection","guides","rotators"];

function kopResultByLabel(rows,label){
  return (rows||[]).find(r=>englishLabel(r.label||"").toLowerCase().includes(englishLabel(label).toLowerCase()))||null;
}

function kopRowById(rows,id){ return (rows||[]).find(r=>r.id===id)||null; }

function kopMeasuredStatus(row,kind){
  if(!row) return "";
  if(kind==="valve"){
    const q=isRejected(row.measuredQ,row.limitQ,row.direction);
    const r=isRejected(row.measuredR,row.limitR,row.direction);
    if(q===null&&r===null) return "";
    return (q||r)?"NOT OK - EXCEEDING LIMITS":"OK";
  }
  if(kind==="guide"){
    if(row.measured===""||row.measured===null||row.measured===undefined) return "";
    const delta=parseFloat(row.measured)-Number(row.nominal||0);
    const bad=isRejected(delta,row.limit,row.direction);
    return bad===null?"":(bad?"NOT OK - EXCEEDING LIMITS":"OK");
  }
  const bad=isRejected(row.measured,row.limit,row.direction);
  return bad===null?"":(bad?"NOT OK - EXCEEDING LIMITS":"OK");
}

function suggestedKopMatrix(koppen,phase){
  const out={valves:{},guides:{},seats:{},seatPocket:{},rotator:{},cwChamber:{},heliCoils:{}};
  ["E1","E2","S1","S2"].forEach(pos=>{
    out.valves[pos]=(koppen||[]).map(k=>kopMeasuredStatus(kopRowById(k.valve,pos),"valve"));
    out.guides[pos]=(koppen||[]).map(k=>kopMeasuredStatus(kopRowById(k.valveGuide,pos),"guide"));
    out.seats[pos]=(koppen||[]).map(k=>kopMeasuredStatus(kopRowById(k.seatRing,pos),"seat"));
    out.seatPocket[pos]=(koppen||[]).map(()=>"");
    out.rotator[pos]=(koppen||[]).map(k=>{
      const x=kopResultByLabel(k.valveChecks,"Valve rotators");
      if(!x||!x.result) return "";
      return x.result==="nee"?"NOT OK":x.result==="ja"?"OK":"";
    });
  });
  out.cwChamber.Chamber=(koppen||[]).map(()=>"");
  out.heliCoils.Qty=(koppen||[]).map(()=>"");
  if(phase==="after"){
    ["valves","guides","seats","seatPocket","rotator","cwChamber"].forEach(section=>{
      Object.keys(out[section]).forEach(row=>{
        out[section][row]=out[section][row].map(v=>String(v||"").startsWith("NOT OK")?"":v);
      });
    });
  }
  return out;
}

function mergeKopMatrix(suggested,existing){
  const out=JSON.parse(JSON.stringify(suggested));
  Object.keys(out).forEach(section=>{
    Object.keys(out[section]).forEach(row=>{
      const old=existing&&existing[section]&&existing[section][row]?existing[section][row]:[];
      out[section][row]=out[section][row].map((v,i)=>old[i]!==undefined&&old[i]!==""?old[i]:v);
    });
  });
  return out;
}

function countMatrix(matrix,section,positions,value){
  let n=0;
  (positions||[]).forEach(pos=>((matrix&&matrix[section]&&matrix[section][pos])||[]).forEach(v=>{if(v===value)n++;}));
  return n;
}

function countMatrixPrefix(matrix,section,positions,prefix){
  let n=0;
  (positions||[]).forEach(pos=>((matrix&&matrix[section]&&matrix[section][pos])||[]).forEach(v=>{if(String(v||"").startsWith(prefix))n++;}));
  return n;
}
function kopReasonCount(matrix,section,positions,reason){
  return countMatrix(matrix,section,positions,"NOT OK - "+reason);
}
function kopReasonText(count,label,reason){
  if(!count) return "";
  const plural=count===1?" was":"s were";
  const reasons={
    "EXCEEDING LIMITS":" found exceeding maker limits. Renewal required. ",
    "CAVITATED":" found cavitated. Renewal required. ",
    "DAMAGED":" found damaged. Renewal required. ",
    "OTHER":" found not acceptable during inspection. Renewal required. "
  };
  return count+" "+label+(count===1?"": "s")+plural+(reasons[reason]||" found not acceptable. Renewal required. ");
}

function suggestedKopTexts(koppen,matrix,phase){
  const heads=(koppen||[]).length;
  const s=["S1","S2"],e=["E1","E2"];
  const sb=countMatrixPrefix(matrix,"valves",s,"NOT OK"),eb=countMatrixPrefix(matrix,"valves",e,"NOT OK");
  const sr=countMatrix(matrix,"valves",s,"RENEWED"),er=countMatrix(matrix,"valves",e,"RENEWED");
  const sg=countMatrix(matrix,"valves",s,"GRINDED"),eg=countMatrix(matrix,"valves",e,"GRINDED");
  const gsb=countMatrixPrefix(matrix,"guides",s,"NOT OK"),geb=countMatrixPrefix(matrix,"guides",e,"NOT OK");
  const gsr=countMatrix(matrix,"guides",s,"RENEWED"),ger=countMatrix(matrix,"guides",e,"RENEWED");
  const ssb=countMatrixPrefix(matrix,"seats",s,"NOT OK"),seb=countMatrixPrefix(matrix,"seats",e,"NOT OK");
  const ssr=countMatrix(matrix,"seats",s,"RENEWED"),ser=countMatrix(matrix,"seats",e,"RENEWED");
  const dye=(koppen||[]).filter(k=>{const x=kopResultByLabel(k.disassembly,"Dye-check");return x&&x.result==="ja";}).length;
  const extra=(koppen||[]).map(k=>k.aanvullendeInfo).filter(Boolean).join(" ");
  let valves="",guides="",seats="";
  if(phase==="before"){
    if(sg) valves+=sg+" suction valve"+(sg===1?" was":"s were")+" found within limit after grinding. ";
    ["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].forEach(r=>{valves+=kopReasonText(kopReasonCount(matrix,"valves",s,r),"suction valve",r);});
    if(sb&&!["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].some(r=>kopReasonCount(matrix,"valves",s,r))) valves+=sb+" suction valve"+(sb===1?" was":"s were")+" found not acceptable. Renewal required. ";
    if(eg) valves+=eg+" exhaust valve"+(eg===1?" was":"s were")+" found within limit after grinding. ";
    ["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].forEach(r=>{valves+=kopReasonText(kopReasonCount(matrix,"valves",e,r),"exhaust valve",r);});
    if(eb&&!["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].some(r=>kopReasonCount(matrix,"valves",e,r))) valves+=eb+" exhaust valve"+(eb===1?" was":"s were")+" found not acceptable. Renewal required. ";
    if(gsb) guides+=gsb+" suction valve guide"+(gsb===1?" was":"s were")+" found exceeding limit. ";
    if(geb) guides+=geb+" exhaust valve guide"+(geb===1?" was":"s were")+" found exceeding limit. Renewal required.";
    ["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].forEach(r=>{seats+=kopReasonText(kopReasonCount(matrix,"seats",s,r),"suction valve seat",r);});
    if(ssb&&!["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].some(r=>kopReasonCount(matrix,"seats",s,r))) seats+=ssb+" suction valve seat"+(ssb===1?" was":"s were")+" found not acceptable. Renewal required. ";
    ["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].forEach(r=>{seats+=kopReasonText(kopReasonCount(matrix,"seats",e,r),"exhaust valve seat",r);});
    if(seb&&!["EXCEEDING LIMITS","CAVITATED","DAMAGED","OTHER"].some(r=>kopReasonCount(matrix,"seats",e,r))) seats+=seb+" exhaust valve seat"+(seb===1?" was":"s were")+" found not acceptable. Renewal required.";
  }else{
    if(sr) valves+=sr+" suction valve"+(sr===1?" was":"s were")+" renewed. ";
    if(er) valves+=er+" exhaust valve"+(er===1?" was":"s were")+" renewed. ";
    if(sg) valves+=sg+" suction valve"+(sg===1?" was":"s were")+" grinded. ";
    if(eg) valves+=eg+" exhaust valve"+(eg===1?" was":"s were")+" grinded.";
    if(gsr) guides+=gsr+" suction valve guide"+(gsr===1?" was":"s were")+" renewed. ";
    if(ger) guides+=ger+" exhaust valve guide"+(ger===1?" was":"s were")+" renewed.";
    if(ssr) seats+=ssr+" suction valve seat"+(ssr===1?" was":"s were")+" renewed. ";
    if(ser) seats+=ser+" exhaust valve seat"+(ser===1?" was":"s were")+" renewed.";
  }
  return {
    landing:"In total "+heads+" ("+String(heads).padStart(2,"0")+") cylinder head"+(heads===1?" was":"s were")+" received for inspection and overhaul.",
    findings:extra||"",
    penetrant:dye?"Penetrant test (dye-check) performed on "+(dye===heads?"all ":"")+"cylinder head combustion surfaces. Results recorded in the inspection report.":"",
    landingSurfaces:"",
    valves:valves.trim(),
    seats:seats.trim(),
    cwConnection:"",
    guides:guides.trim(),
    rotators:""
  };
}

function newKopPart(values){
  return Object.assign({
    id:"part_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),
    headNo:"",category:"",position:"",action:"",qty:1,partNo:"",description:"",remark:""
  },values||{});
}

function suggestedKopParts(koppen,matrix,phase){
  const result=[];
  const defs=[
    ["valves","Valve","Valve"],
    ["guides","Valve guide","Valve guide"],
    ["seats","Valve seat","Valve seat"],
    ["rotator","Valve rotator","Valve rotator"]
  ];
  defs.forEach(([section,category,label])=>{
    const rows=matrix&&matrix[section]||{};
    Object.keys(rows).forEach(position=>{
      (koppen||[]).forEach((kop,hi)=>{
        const status=(rows[position]&&rows[position][hi])||"";
        const needsPart=phase==="before"?status.indexOf("NOT OK")===0:status==="RENEWED";
        if(!needsPart)return;
        result.push(newKopPart({
          headNo:String(kop.nummer||""),
          category,
          position,
          action:phase==="before"?"PROPOSED":"RENEWED",
          qty:1,
          description:label+" "+position,
          remark:status
        }));
      });
    });
  });
  const coils=matrix&&matrix.heliCoils&&matrix.heliCoils.Qty||[];
  (koppen||[]).forEach((kop,hi)=>{
    const qty=parseInt(coils[hi],10)||0;
    if(qty>0) result.push(newKopPart({
      headNo:String(kop.nummer||""),
      category:"Heli-coil",
      position:"",
      action:phase==="before"?"PROPOSED":"REQUIRED",
      qty,
      description:"Heli-coil",
      remark:"Required according to cylinder head matrix"
    }));
  });
  return result;
}

function mergeSuggestedKopParts(existing,suggested){
  const out=Array.isArray(existing)?existing.slice():[];
  const key=p=>[p.headNo,p.category,p.position,p.action].map(v=>String(v||"").trim().toLowerCase()).join("|");
  const present=new Set(out.map(key));
  (suggested||[]).forEach(p=>{const k=key(p);if(!present.has(k)){out.push(p);present.add(k);}});
  return out;
}

function cylinderReportPdfChunks(element){

 const report=measurements.parentElement;

 const chunks=[],header=shell();
 for(const node of report.children){if(node===measurements)break;header.appendChild(node.cloneNode(true));}
 if(header.children.length)chunks.push(header);
 for(const head of measurements.querySelectorAll(":scope > .cylinder-head-measurements-item")){
  const inspections=head.querySelectorAll(".yanmar-approved-inspection, .manufacturer-approved-inspection");
  for(const approved of inspections){

 if(type!=="voeringen_voor"&&type!=="voeringen_na")return null;
 const d=report?.data?.cylinderLiners||{};

    React.createElement("thead",null,

function turboPatch(data,path,value){

 for(const key of keys.slice(0,-1)){dst[key]=Array.isArray(src?.[key])?[...src[key]]:{...(src?.[key]||{})};dst=dst[key];src=src?.[key];}

  function controleWaarschuwingen(){
    if(!activeWerkorder) return [];
    const out=[];
    if(!activeWerkorder.uitgevoerd) out.push("Work has not yet been marked as completed.");
    if(isCilinderkopKlustype(activeWerkorder.klustype)){
      (koppen||[]).forEach(k=>(k.onderdelen||[]).forEach(p=>{
        if(["Required","Ordered"].includes(p.beforeStatus||"") && !p.afterStatus) out.push(`Head ${k.nummer}: ${englishLabel(p.name)} is ${englishChoice(p.beforeStatus)}, but AFTER is still empty.`);
      }));
    }
    if(isDrijfstangKlustype(activeWerkorder.klustype)){
      (drijfstangRapporten||[]).forEach(d=>{
        const vals=(d.metingen?.positions||[]).flatMap(r=>[r.bigEnd,r.smallEnd]).filter(v=>String(v??"").trim()!=="");
        if(!vals.length) out.push(`Connecting rod ${d.nummer}: no measurements have been entered yet.`);
      });
    }
    if(isKrukasKlustype(activeWerkorder.klustype)&&krukasRapport){
